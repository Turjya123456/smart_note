<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteNest - Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: var(--bg-gradient);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--glass-border);
            padding: 36px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .admin-header h1 {
            font-size: 26px;
            font-weight: 800;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 32px;
        }

        th, td {
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 12px;
        }

        .role-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 700;
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .add-user-card {
            background: var(--bg-solid);
            padding: 24px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .add-user-form {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        @media (max-width: 600px) {
            .add-user-form { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body class="light-mode">
    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1>🪺 NoteNest Admin</h1>
                <p style="color: var(--text-muted); font-size: 14px;">User Management Dashboard</p>
            </div>
            <button class="danger-btn" onclick="logout()">Logout</button>
        </div>

        <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Active Users</h3>
        <table id="users-table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="users-tbody">
                <!-- Injected via app script -->
            </tbody>
        </table>

        <div class="add-user-card">
            <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 14px;">Add New User</h3>
            <form class="add-user-form" id="add-user-form">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Username</label>
                    <input type="text" id="new-username" required placeholder="New username">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Password</label>
                    <input type="password" id="new-password" required placeholder="••••••••">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Role</label>
                    <select id="new-role">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="primary-btn" style="height: 42px;">Add User</button>
            </form>
        </div>
    </div>

    <script>
        async function fetchUsers() {
            try {
                const res = await fetch('/api/admin/users');
                if (res.status === 401 || res.status === 403) {
                    window.location.href = '/login';
                    return;
                }
                const users = await res.json();
                const tbody = document.getElementById('users-tbody');
                tbody.innerHTML = '';
                
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    
                    const tdUsername = document.createElement('td');
                    tdUsername.textContent = user.username;
                    tdUsername.style.fontWeight = '600';
                    
                    const tdRole = document.createElement('td');
                    const roleBadge = document.createElement('span');
                    roleBadge.className = 'role-badge';
                    roleBadge.textContent = user.role;
                    tdRole.appendChild(roleBadge);
                    
                    const tdAction = document.createElement('td');
                    if (user.username === 'admin') {
                        const span = document.createElement('span');
                        span.style.color = 'var(--text-muted)';
                        span.style.fontSize = '12px';
                        span.style.fontStyle = 'italic';
                        span.textContent = 'Protected Admin';
                        tdAction.appendChild(span);
                    } else {
                        const btn = document.createElement('button');
                        btn.className = 'danger-btn';
                        btn.style.padding = '4px 12px';
                        btn.style.fontSize = '12px';
                        btn.textContent = 'Delete';
                        btn.onclick = () => deleteUser(user.id);
                        tdAction.appendChild(btn);
                    }

                    tr.appendChild(tdUsername);
                    tr.appendChild(tdRole);
                    tr.appendChild(tdAction);
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            
            try {
                const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    fetchUsers();
                } else {
                    alert('Failed to delete user');
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('add-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('new-username').value;
            const password = document.getElementById('new-password').value;
            const role = document.getElementById('new-role').value;

            try {
                const res = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });

                if (res.ok) {
                    document.getElementById('new-username').value = '';
                    document.getElementById('new-password').value = '';
                    fetchUsers();
                } else {
                    const data = await res.json();
                    alert(data.error || 'Failed to create user');
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred');
            }
        });

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        fetchUsers();
    </script>
</body>
</html>
